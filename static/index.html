<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tiny Office</title>
<style>
:root{--bg:#eef3fb;--ink:#2d3047;--muted:#7a8199;--card:#fff;--line:#dbe3f0;--accent:#ff7a59;--ok:#3fbf7f;--bad:#e5645a}
*{box-sizing:border-box}body{margin:0;font:14px/1.4 ui-rounded,"SF Pro Rounded","Nunito",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:20px;font-weight:800}.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
.pill.nav{color:var(--ink);border-color:var(--ink);box-shadow:0 2px 0 var(--ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--bad);margin-right:5px}.dot.on{background:var(--ok)}
.wrap{padding:0 20px 20px}
#stage{position:relative;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;border:4px solid #2d3047;background:#bfe0ff;box-shadow:0 6px 0 #2d3047;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
#ui{position:absolute;inset:0;pointer-events:none}
.bubble,.name,.room,.zz{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-weight:800}
.bubble{background:#fff;border:3px solid var(--ink);border-radius:10px;padding:3px 9px;font-size:12px;max-width:220px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 3px 0 var(--ink)}
.bubble:empty,.zz:empty{display:none}
.name{font-size:11px;color:#fff;background:#2d3047cc;border-radius:6px;padding:1px 7px;transform:translate(-50%,0)}
.room{font-size:12px;color:#2d3047;background:#ffffffd9;border:2px solid var(--ink);border-radius:8px;padding:1px 8px}
.room.go{pointer-events:auto;cursor:pointer;background:#fff;box-shadow:0 2px 0 var(--ink)}
.zz{font-size:16px;color:#fff;text-shadow:0 2px 0 #2d3047;animation:float 2s infinite}
@keyframes float{from{margin-top:0;opacity:1}to{margin-top:-14px;opacity:0}}
.ctl{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.ctl button{width:34px;height:34px;padding:0;background:#fff;color:var(--ink);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-size:16px}
.emo{font-size:52px;line-height:1;background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:8px;box-shadow:0 4px 0 var(--ink)}
/* ---------- drawer ---------- */
#shade{position:fixed;inset:0;background:#3b2f2a55;opacity:0;pointer-events:none;transition:.2s;z-index:9998}
#drawer{position:fixed;top:0;right:0;height:100%;width:min(460px,100%);background:var(--bg);border-left:3px solid var(--line);transform:translateX(100%);transition:.25s;z-index:9999;overflow:auto;padding:16px}
.open #shade{opacity:1;pointer-events:auto}.open #drawer{transform:none}
.dhead{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.dhead h2{margin:0;font-size:18px}.x{margin-left:auto;align-self:flex-start;background:none;color:var(--muted);font-size:20px;padding:0 6px}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:14px}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
select,textarea,input{font:inherit;border-radius:10px;border:2px solid var(--line);padding:7px 9px;background:#fff;color:var(--ink);width:100%}
textarea{resize:vertical;min-height:60px}
button{font:inherit;background:var(--accent);color:#fff;border:none;font-weight:700;cursor:pointer;border-radius:10px;padding:7px 12px}
button.ghost{background:transparent;color:var(--muted);border:2px solid var(--line)}
.row{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}.tabs button{background:var(--card);color:var(--muted);border:2px solid var(--line)}.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.t{border:1px solid var(--line);border-radius:12px;padding:8px;background:#fff;margin-bottom:8px}
.t .top{display:flex;justify-content:space-between;gap:6px;font-size:12px}.t .ttl{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{font-size:11px;padding:1px 7px;border-radius:99px;flex:none;background:#eee}
.st.working,.st.waiting{background:#d6f0ff}.st.review{background:#ffe7b3}.st.done{background:#d3f5dc}.st.error,.st.rejected{background:#ffd3d3}.st.coffee{background:#f0dcc8}
.out{white-space:pre-wrap;font-size:12px;color:#5a4d46;margin-top:6px;max-height:160px;overflow:auto}
.muted{color:var(--muted);font-size:12px}.msg{font-size:12px}
.stat{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;font-size:13px;align-items:center}
code{background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-size:12px;word-break:break-all}
.chip{display:inline-block;font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin:4px 4px 0 0;color:var(--muted);font-weight:700}
/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto;margin-bottom:8px}
.cm{max-width:90%;padding:7px 10px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:13px;white-space:pre-wrap}
.cm.me{align-self:flex-end;background:#ffe9e2;border-color:#ffc9b8}.cm .md{white-space:normal}
/* ---------- modal (board / archive) ---------- */
#modal{position:fixed;inset:0;background:#3b2f2a55;display:none;z-index:10000;padding:3vh 3vw}
#modal.on{display:block}
.mbox{background:var(--bg);border:4px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);height:100%;display:flex;flex-direction:column;overflow:hidden}
.mhead{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:2px solid var(--line);flex-wrap:wrap}.mhead h2{margin:0;font-size:18px;margin-right:auto}
.mhead select{width:auto}.mhead .tabs{margin:0}
.mbody{flex:1;overflow:auto;padding:14px 16px}
.kan{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:10px;min-width:1080px;align-items:start}
.col{background:#ffffff80;border:2px solid var(--line);border-radius:14px;padding:8px}.col h4{margin:2px 4px 8px;font-size:13px}
.kc{background:#fff;border:2px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:7px 9px;margin-bottom:7px;font-size:12px}
.kc summary{cursor:pointer}
.tl{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px}.tl h4{margin:0 0 6px}
.tlr{display:grid;grid-template-columns:minmax(120px,240px) 1fr;gap:10px;align-items:center}
.tll{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane{position:relative;height:26px;margin:3px 0;background:repeating-linear-gradient(90deg,#eef3fb 0 1px,transparent 1px 10%);border-radius:6px}
.bar{position:absolute;top:2px;height:22px;border-radius:7px;background:var(--c);color:#fff;font-size:11px;font-weight:700;padding:2px 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border:2px solid var(--ink);min-width:10px}
.bar.open{background-image:repeating-linear-gradient(45deg,#ffffff40 0 6px,transparent 6px 12px)}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.arch{display:grid;grid-template-columns:320px 1fr;gap:14px;align-items:start}
@media(max-width:780px){.arch{grid-template-columns:1fr}#modal{padding:8px}}
.pf{display:flex;gap:10px;align-items:center;cursor:pointer}.pf.on{border-color:var(--accent);box-shadow:0 3px 0 var(--accent)}
.md{font-size:13px}.md h3,.md h4,.md h5,.md h6{margin:10px 0 4px}.md p{margin:4px 0}.md li{margin-left:18px}
.md pre,pre.code{background:var(--ink);color:#fff;padding:10px;border-radius:10px;overflow:auto;font-size:12px;white-space:pre}
.md table{border-collapse:collapse;font-size:12px;margin:6px 0}.md td{border:1px solid var(--line);padding:3px 7px}
.files div{font-size:12px;padding:3px 6px;border-radius:6px;cursor:pointer}.files div:hover{background:var(--bg)}
.bubble.say{background:#fffbe6;border-color:var(--accent);box-shadow:0 3px 0 var(--accent);max-width:260px;white-space:normal;text-align:center;z-index:2}
/* ---------- calendar ---------- */
.prog{height:10px;background:var(--bg);border-radius:99px;overflow:hidden;border:2px solid var(--line);margin-top:5px}.prog i{display:block;height:100%;background:var(--ok)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:12px}
.pgrid .card{margin:0;border-left:6px solid var(--c);cursor:pointer}
.calw{overflow-x:auto}.cal{display:grid;grid-template-columns:repeat(7,minmax(96px,1fr));gap:6px;min-width:700px}
.cal .wd{font-size:12px;font-weight:800;color:var(--muted);text-align:center}
.cd{background:#fff;border:2px solid var(--line);border-radius:12px;min-height:100px;padding:5px 6px;font-size:11px;cursor:pointer;overflow:hidden}
.cd b{font-size:12px}.cd.out{opacity:.4}.cd.today{border-color:var(--accent);box-shadow:0 3px 0 var(--accent)}.cd.sel{outline:3px solid var(--ink)}
.pstrip{height:6px;border-radius:3px;margin:3px 0 0;background:var(--c)}
.tchip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:4px solid var(--c);padding-left:4px;margin-top:3px}
</style></head><body>
<header><h1>🧱 Tiny Office <span style="font-weight:600;color:var(--muted);font-size:14px">virtual AI agency</span></h1>
 <div class="pills"><span class="pill nav" onclick="open_('sara')">🛎️ Talk to Sara</span><span class="pill nav" onclick="open_('max')">📊 Summary</span>

 g.strokeStyle="#0001";g.lineWidth=2;g.strokeRect(0,0,64,64);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(n[0],n[1]);
 return new THREE.MeshStandardMaterial({map:t,roughness:.7})}

/* ---------- mini markdown ---------- */
function md(s){const out=[];let code=null,table=false;
 const inl=l=>esc(l).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
 for(const line of String(s||"").split("\n")){
  if(line.trim().startsWith("```")){if(code!==null){out.push(`<pre>${esc(code)}</pre>`);code=null}else code="";continue}
  if(code!==null){code+=line+"\n";continue}
  const row=/^\s*\|.*\|\s*$/.test(line);if(table&&!row){out.push("</table>");table=false}
  if(row){if(/^\s*\|[\s:|-]+\|\s*$/.test(line))continue;if(!table){out.push("<table>");table=true}out.push("<tr>"+line.trim().slice(1,-1).split("|").map(c=>`<td>${inl(c.trim())}</td>`).join("")+"</tr>");continue}
  const h=line.match(/^(#{1,4})\s+(.*)/);
  if(h)out.push(`<h${h[1].length+2}>${inl(h[2])}</h${h[1].length+2}>`);
  else if(/^\s*([-*]|\d+\.)\s/.test(line))out.push(`<li>${inl(line.replace(/^\s*([-*]|\d+\.)\s/,""))}</li>`);
  else if(line.trim()&&!/^<!--.*-->$/.test(line.trim()))out.push(`<p>${inl(line)}</p>`)}
 if(code!==null)out.push(`<pre>${esc(code)}</pre>`);if(table)out.push("</table>");return out.join("")}

const PAL=["#ff7a59","#5fa8ff","#3fbf7f","#b28cff","#ffb02e","#ff6fa3","#2fb8b0","#8d6e63"];

async function openCal(p){if(p!==undefined)CP=p;closeD();const n=new Date();CM=CM||new Date(n.getFullYear(),n.getMonth(),1);CSEL=CSEL||dkey(n);CKEY="";modal("cal","📅 Calendar");await renderCal(true)}
function calNav(k){const n=new Date();CM=k===0?new Date(n.getFullYear(),n.getMonth(),1):new Date(CM.getFullYear(),CM.getMonth()+k,1);if(k===0)CSEL=dkey(n);renderCal(true)}
async function renderCal(force){let d;try{d=await (await fetch("/api/board")).json()}catch{return}if(MK!=="cal")return;
 const key=JSON.stringify([d.tasks.map(t=>[t.id,t.status,t.review?.approved]),CP,CSEL,+CM]);if(!force&&key===CKEY)return;CKEY=key;
 const nameOf=s=>d.projects.find(p=>p.slug===s)?.name||s,now=Date.now()/1000;
 const tasks=d.tasks.filter(t=>!CP||(CP==="__none"?!t.project:t.project===CP));
 const projs=(CP&&CP!=="__none"?d.projects.filter(p=>p.slug===CP):CP==="__none"?[]:d.projects).map(p=>{const ts=d.tasks.filter(t=>t.project===p.slug);
  const open=ts.some(t=>["queued","waiting","working","review"].includes(t.status)),done=ts.filter(t=>["done","rejected"].includes(t.status)).length;
  return{...p,ts,done,open,start:ts.length?Math.min(...ts.map(t=>t.ts)):null,end:open?now:ts.length?Math.max(...ts.map(t=>t.finished||t.ts)):null}}).filter(p=>p.start);

  <button class="ghost" onclick="calNav(-1)">◀</button><b style="min-width:130px;text-align:center">${CM.toLocaleString([],{month:"long",year:"numeric"})}</b><button class="ghost" onclick="calNav(1)">▶</button><button class="ghost" onclick="calNav(0)">Today</button>`;
 const prog=projs.map(p=>{const pct=Math.round(p.done/p.ts.length*100);return `<div class="card" style="--c:${pcol(p.slug)}" data-s="${esc(p.slug)}" onclick="CP=this.dataset.s;renderCal(true)">

 const first=new Date(CM),off=(first.getDay()+6)%7,start=new Date(first.getFullYear(),first.getMonth(),1-off),today=dkey(new Date());

   ${ps.map(p=>`<div class="pstrip" style="--c:${pcol(p.slug)}" title="${esc(p.name)}"></div>`).join("")}

  ${t.project?`<span class="chip">📁 ${esc(nameOf(t.project))}</span>`:""}${ev.map(x=>`<span class="chip">${x}</span>`).join("")}${t.review?`<span class="chip" title="${esc(t.review.feedback)}">${t.review.approved?"✅ approved":"🔧 fixes requested"}</span>`:""}</div>`}).join("");
 $("mb").innerHTML=`${prog?`<div class="pgrid">${prog}</div>`:""}<div class="calw"><div class="cal">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(w=>`<div class="wd">${w}</div>`).join("")}${cells.join("")}</div></div>

  <button onclick="newOffice(this)">🏗️ Build</button><span class="msg"></span></div><div class="muted">New offices are added at the east end of the building, each with 4 desks.</div></div>
 <div class="card"><h3>🧑‍🤝‍🧑 People & their AI brain</h3>${Object.keys(P).filter(k=>k!=="boss").map(k=>`<div class="t"><div class="top"><span class="ttl">${P[k].emo} <b>${esc(P[k].name)}</b> <span class="muted">${esc(P[k].role.split(" · ")[0])}</span></span>
   ${brainSel(k,TEAM.brains[k],`onchange="setBrain('${k}',this.value,this)"`)}</div>${P[k].custom?`<div class="row"><button class="ghost" onclick="editAgent('${k}')">✏️ Edit</button><button class="ghost" onclick="delAgent('${k}',this)">🗑️ Remove</button><span class="msg"></span></div>`:""}</div>`).join("")}</div>
 <div class="card" id="af"><h3>${e?"✏️ Edit "+esc(e.name):"➕ Hire a new team member"}</h3>
  <div style="display:grid;grid-template-columns:1fr 220px;gap:12px;align-items:start"><div>
   <label>Name</label><input id="an" value="${esc(v.name||"")}" placeholder="e.g. Layla"><label>Job title</label><input id="ar" value="${esc(v.role||"")}" placeholder="e.g. Sales Agent">
   <div class="row"><input id="ae" value="${esc(v.emoji)}" style="width:70px" title="Avatar emoji"><input id="ai" value="${esc(v.item)}" style="width:70px" title="Task icon"><span class="muted">emoji · task icon</span></div>
   <label>Office</label><select id="ao">${offices.map(r=>`<option value="${r.id}" ${v.office===r.id?"selected":""}>${rname(r)} (${capOf(r)-usedIn(r,AFEDIT)} free)</option>`).join("")||'<option value="">No free desks: build an office first</option>'}</select>
  </div><div><div id="pv" style="width:220px;height:220px;border:3px solid var(--ink);border-radius:14px;overflow:hidden;box-shadow:0 4px 0 var(--ink)"></div><div class="muted" style="text-align:center">live preview</div></div></div>
  <label>Look</label><div class="row" style="margin-top:0"><select id="as" style="width:auto">${opts(STYLES,v.style)}</select><select id="ah" style="width:auto">${opts(HATS,v.hat)}</select><select id="ad" style="width:auto">${opts(HOLDS,v.hold)}</select></div>
  <div class="row"><span class="muted">Body</span><input id="c0" type="color" value="${v.colors[0]}" style="width:46px;padding:2px"><span class="muted">Head</span><input id="c1" type="color" value="${v.colors[1]}" style="width:46px;padding:2px">
   <span class="muted">Belly</span><input id="c2" type="color" value="${v.colors[2]}" style="width:46px;padding:2px"><span class="muted">Accent</span><input id="c3" type="color" value="${v.tone}" style="width:46px;padding:2px"></div>
  <label>Size</label><input id="az" type="range" min="1.2" max="1.7" step=".05" value="${v.scale}">
  <label>What they do (personality and instructions)</label><textarea id="ap" placeholder="e.g. You handle sales leads: qualify them, write follow-up messages and quotes. Be persuasive but honest.">${esc(v.prompt||"")}</textarea>
  <label><input type="checkbox" id="af2" ${v.files?"checked":""} style="width:auto"> Writes real files (code, SVG, documents) into project folders</label>
  <label>AI brain</label>${brainSel("",e?TEAM.brains[e.id]:"",'id="ab"')}
  <div class="row"><button onclick="saveAgent(this)">${e?"💾 Save changes":"🎉 Hire"}</button>${e?`<button class="ghost" onclick="AFEDIT=null;openManager('office')">Cancel</button>`:""}<span class="msg"></span></div></div>`}
function formSpec(){const g=id=>$(id)?.value;return{name:g("an"),c:[g("c0"),g("c1"),g("c2")],t:g("c3"),s:+g("az"),style:g("as"),hat:g("ah"),hold:g("ad"),custom:true,limb:g("as")==="iggy"?"#2d3047":undefined}}
let PV=null;
function preview(){const box_=$("pv");if(!box_)return;
 if(!PV){const sc=new THREE.Scene();sc.background=new THREE.Color(0xeef3fb);sc.add(new THREE.HemisphereLight(0xffffff,0x9c8f84,.8));const dl=new THREE.DirectionalLight(0xffffff,.6);dl.position.set(3,6,5);sc.add(dl);
  const c2=new THREE.PerspectiveCamera(30,1,.1,50);c2.position.set(0,3.6,10);c2.lookAt(0,2.3,0);const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(220,220);PV={sc,c2,r,g:null}}
 if(PV.r.domElement.parentNode!==box_){box_.innerHTML="";box_.appendChild(PV.r.domElement)}
 if(PV.g)PV.sc.remove(PV.g);PV.g=creature("preview",formSpec(),PV.sc,false).g;
 $("af").querySelectorAll("input,select").forEach(i=>i.oninput=i.onchange=preview)}
(function pvLoop(){if(PV&&$("pv")&&PV.g){PV.g.rotation.y+=.012;PV.r.render(PV.sc,PV.c2)}requestAnimationFrame(pvLoop)})();
const reloadTo=w=>{location.hash="open="+encodeURIComponent(w);location.reload()};
async function newOffice(btn){const name=$("on").value.trim(),m=btn.nextElementSibling;if(!name){m.textContent="Name required";return}
 const c=$("oc").value,shade=c.replace(/[0-9a-f]{2}/gi,h=>Math.max(0,parseInt(h,16)-14).toString(16).padStart(2,"0"));
 const r=await post("/api/offices",{name,emoji:$("oe").value.trim(),colors:[c,shade]});if(!r.ok){m.textContent=(await r.json()).detail;return}reloadTo("office")}
async function delOffice(id,btn){if(!confirm("Remove this office?"))return;const r=await fetch("/api/offices/"+id,{method:"DELETE"});if(!r.ok){btn.nextElementSibling.textContent=(await r.json()).detail;return}reloadTo("office")}
async function setBrain(id,prov,sel){await post("/api/brains",{agent:id,provider:prov},"PUT");TEAM.brains[id]=prov||undefined;sel.style.borderColor="var(--ok)"}
function editAgent(id){AFEDIT=id;openManager("office");setTimeout(()=>$("af")?.scrollIntoView({behavior:"smooth"}),50)}
async function delAgent(id,btn){if(!confirm(`Remove ${P[id].name} from the team? Their finished work stays in the projects.`))return;const r=await fetch("/api/agents/"+id,{method:"DELETE"});
 if(!r.ok){btn.parentElement.querySelector(".msg").textContent=(await r.json()).detail;return}reloadTo("office")}
async function saveAgent(btn){const m=btn.parentElement.querySelector(".msg"),sp=formSpec(),g=id=>$(id).value;
 const body={name:g("an").trim(),role:g("ar").trim(),emoji:g("ae").trim()||"🙂",item:g("ai").trim()||"⭐",tone:sp.t,colors:sp.c,style:sp.style,hat:sp.hat,hold:sp.hold,scale:sp.s,
  prompt:g("ap").trim(),files:$("af2").checked,office:g("ao"),provider:g("ab")};
 if(!body.name||!body.role){m.textContent="Name and job title are required";return}if(!body.office){m.textContent="Build an office with free desks first";return}
 const r=await post(AFEDIT?"/api/agents/"+AFEDIT:"/api/agents",body,AFEDIT?"PATCH":"POST");const d=await r.json();if(!r.ok){m.textContent="⚠️ "+d.detail;return}reloadTo(d.id)}

/* ---------- manager / settings ---------- */
let CFG={};
const f=(k,lbl,type="text",ph="")=>`<label>${lbl}</label>${type==="area"?`<textarea data-k="${k}" placeholder="${ph}">${esc(CFG[k])}</textarea>`:`<input data-k="${k}" type="${type}" value="${esc(CFG[k])}" placeholder="${ph}">`}`;
const brainHTML=()=>`<b>${esc(H.provider_label||"AI")}:</b> ${H.reachable?"🟢 connected":"🔴 not connected"} · <b>Model:</b> ${esc(H.model||"")} ${H.model_ready?"🟢":"🔴 not found"}
 ${H.error?`<div class="muted">⚠️ ${esc(H.error)}</div>`:""}${H.pull?.status?`<div class="muted">Download: ${esc(H.pull.status)} ${H.pull.pct?H.pull.pct+"%":""}</div>`:""}`;
const PROV=TEAM.providers,PICON={ollama:"🦙",openai:"🟢",anthropic:"🟠",gemini:"🔷",deepseek:"🐋",qwen:"🟣"};
const KEYHINT={ollama:"ollama.com/settings/keys",openai:"platform.openai.com/api-keys",anthropic:"console.anthropic.com → API keys",gemini:"aistudio.google.com/apikey",deepseek:"platform.deepseek.com/api_keys",qwen:"Alibaba Cloud Model Studio → API keys"};
const provCard=p=>{const U=p.toUpperCase(),on=(CFG.LLM_PROVIDER||"ollama")===p;
 return `<div class="card" style="${on?"border-color:var(--accent)":""}"><h3>${PICON[p]} ${esc(PROV[p])}${on?' <span class="chip">default brain</span>':""}</h3>
 ${p==="ollama"?f("OLLAMA_URL","Ollama URL","text","https://ollama.com (cloud) or http://localhost:11434"):""}${p==="qwen"?f("QWEN_URL","Endpoint (region)","text","https://dashscope-intl.aliyuncs.com/compatible-mode/v1"):""}
 ${f(U+"_API_KEY","API key"+(p==="ollama"?" (cloud only)":""),"password","get one at "+KEYHINT[p])}
 <label>Model</label><input data-k="${U}_MODEL" list="ml-${p}" value="${esc(CFG[U+"_MODEL"])}"><datalist id="ml-${p}"></datalist>
 <div class="row"><button class="ghost" onclick="loadModels('${p}',this)">🔄 Load models</button><button class="ghost" onclick="test('llm-${p}',this)">Test</button><span class="msg"></span></div>
 ${p==="ollama"?`<div class="row"><button class="ghost" onclick="save().then(()=>post('/api/pull')).then(health)">⬇️ Download model (local only)</button></div>`:""}</div>`};
async function loadModels(p,btn){const m=btn.parentElement.querySelector(".msg");m.textContent="Loading…";await save();
 const r=await (await fetch("/api/models?provider="+p)).json();$("ml-"+p).innerHTML=r.models.map(x=>`<option value="${esc(x)}">`).join("");
 m.textContent=r.ok?`${r.models.length} models found. Click the model box to pick one`:"⚠️ "+r.msg}
async function openManager(t){closeM();tab=t||tab;CFG=await (await fetch("/api/settings")).json();const T={team:"👥 Team",office:"🏢 Offices & people",brain:"🧠 AI brains",connections:"🔌 Connections",prompts:"🎭 Personalities"};
 const body={
 office:officeHTML(),
 team:`<div class="card"><h3>👥 Team status</h3><div class="stat" id="team"></div></div><div class="card"><h3>📬 Waiting for your approval</h3><div id="dtasks"></div></div>`,
 brain:`<div class="card"><h3>🧠 Default AI brain</h3><div id="brain" class="msg">${brainHTML()}</div>
  <label>Everyone uses this brain unless you give a person their own (🏢 Offices & people tab)</label>
  <select data-k="LLM_PROVIDER">${Object.entries(PROV).map(([k,v])=>`<option value="${k}" ${(CFG.LLM_PROVIDER||"ollama")===k?"selected":""}>${PICON[k]} ${esc(v)}</option>`).join("")}</select>
  ${f("PARALLEL","AI calls at the same time (restart to apply)","number")}</div>
  ${Object.keys(PROV).map(provCard).join("")}
  <div class="card"><h3>🏷️ Brand & workflow</h3>${f("BRAND_PROFILE","Brand profile (who you are, tone, offers)","area")}
  <label><input type="checkbox" id="auto" ${CFG.AUTO_SEND==="true"?"checked":""} style="width:auto"> Auto-send replies without my approval</label>
  <label><input type="checkbox" id="pmr" ${CFG.PM_REVIEW!=="false"?"checked":""} style="width:auto"> Max reviews finished project work and sends it back once for fixes if needed</label>
  ${f("COFFEE_SECONDS","Coffee break after each task (seconds)","number")}${f("PROJECTS_DIR","Projects folder (the Archive)")}</div>`,
 connections:`<div class="card"><h3>✉️ Email</h3>${f("IMAP_HOST","IMAP host","text","imap.gmail.com")}${f("IMAP_USER","IMAP user")}${f("IMAP_PASS","IMAP password / app password","password")}
  ${f("SMTP_HOST","SMTP host","text","smtp.gmail.com")}${f("SMTP_PORT","SMTP port")}${f("SMTP_USER","SMTP user")}${f("SMTP_PASS","SMTP password","password")}${f("EMAIL_POLL_SECONDS","Check inbox every (seconds)","number")}
  <div class="row"><button class="ghost" onclick="test('email',this)">Test</button><span class="msg"></span></div></div>
  <div class="card"><h3>💬 WhatsApp Cloud API</h3>${f("WA_PHONE_ID","Phone number ID")}${f("WA_TOKEN","Access token","password")}<div class="row"><button class="ghost" onclick="test('whatsapp',this)">Test</button><span class="msg"></span></div></div>
  <div class="card"><h3>📸 Instagram Graph API</h3>${f("IG_USER_ID","Instagram business account ID")}${f("IG_TOKEN","Access token","password")}<div class="row"><button class="ghost" onclick="test('instagram',this)">Test</button><span class="msg"></span></div></div>
  <div class="card"><h3>🔗 Meta webhook</h3><div class="muted">Callback URL: <code>https://&lt;your-public-host&gt;/webhook</code><br>Subscribe WhatsApp <i>messages</i>, Instagram <i>messages</i> + <i>comments</i>.</div>${f("WEBHOOK_VERIFY_TOKEN","Verify token")}</div>`,
 prompts:`<div class="card"><h3>🎭 Employee personalities</h3>${Object.keys(P).filter(k=>k!=="boss"&&!P[k].custom).map(k=>f("PROMPT_"+k,`${P[k].i} ${P[k].name} · ${P[k].role.split(" · ")[0]}`,"area")).join("")}</div>`};
 show("boss",`<div class="tabs">${Object.entries(T).map(([k,v])=>`<button class="${k===tab?"on":""}" onclick="openManager('${k}')">${v}</button>`).join("")}</div>${body[tab]}
  ${tab!=="team"&&tab!=="office"?`<div class="row"><button onclick="save(this)">💾 Save settings</button><span class="msg" id="saved"></span></div>`:""}`);if(tab==="office")preview()}
async function save(btn){const d={};document.querySelectorAll("#drawer [data-k]").forEach(i=>d[i.dataset.k]=i.value);if($("auto"))d.AUTO_SEND=$("auto").checked?"true":"false";if($("pmr"))d.PM_REVIEW=$("pmr").checked?"true":"false";
 await post("/api/settings",d);if($("saved"))$("saved").textContent="Saved ✓";health()}
async function test(w,btn){await save();btn.nextElementSibling.textContent="Testing…";const r=await (await post("/api/test/"+w)).json();btn.nextElementSibling.textContent=r.msg}

tick();health();loadProjects();setInterval(tick,1200);setInterval(health,6000);
{const h=location.hash.match(/^#open=(.+)/);if(h){history.replaceState(null,"",location.pathname);const w=decodeURIComponent(h[1]);setTimeout(()=>w==="office"?openManager("office"):open_(w),500)}}
</script></body></html>
